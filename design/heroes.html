<!doctype html><html><head><meta charset="utf-8"><title>Ad Finder hero photos</title>
<style>body{margin:0;font:16px/1.5 system-ui;background:#09090b;color:#f4f4f6}header{padding:28px 32px}h1{margin:0 0 4px;font-size:26px}p{margin:0;color:#a3a7b3}
.row{display:grid;grid-template-columns:1fr 260px;gap:20px;padding:0 32px 40px;align-items:start}h2{grid-column:1/-1;margin:0;font-size:19px}
img{width:100%;border-radius:10px;border:1px solid #2f313a}</style></head><body>
<header><h1>Hero photo options (direction B, dark)</h1><p>Round 2 (top four): Nano Banana 2.1 with the real Ad Finder dashboard as an image reference, in a candid documentary style. Round 1 (below): Nano Banana Pro, abstract screens. Desktop left, phone right.</p></header>
<script>
[["final-dark","Chosen · C with the real dashboard composited on screen (dark)"],["final-light","Chosen · the same, light theme"],["r2-closeup","Round 2 · A · Over the shoulder, the dashboard filling the screen (most legible)"],["r2-happy","Round 2 · B · Founder laughing at the dashboard"],["r2-pair","Round 2 · C · Two colleagues, one pointing at a brand card"],["r2-focused","Round 2 · D · Strategist reading the dashboard closely"],["work-focused","1 · Working: strategist studying a wall of ads"],["work-overshoulder","2 · Working: over the shoulder, two screens of ads and timelines"],["happy-leanback","3 · Happy: founder leaning back, pleased"],["happy-pair","4 · Happy: two colleagues laughing at an ad"]].forEach(([k,t])=>document.write(`<div class="row"><h2>${t}</h2><img src="shots/hero-${k.startsWith('final') ? 'final-' + k.slice(6) : k}-1440.jpg" alt=""><img src="shots/hero-${k.startsWith('final') ? 'final-' + k.slice(6) : k}-390.jpg" alt=""></div>`));
</script></body></html>
