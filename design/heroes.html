<!doctype html><html><head><meta charset="utf-8"><title>Ad Finder hero photos</title>
<style>body{margin:0;font:16px/1.5 system-ui;background:#09090b;color:#f4f4f6}header{padding:28px 32px}h1{margin:0 0 4px;font-size:26px}p{margin:0;color:#a3a7b3}
.row{display:grid;grid-template-columns:1fr 260px;gap:20px;padding:0 32px 40px;align-items:start}h2{grid-column:1/-1;margin:0;font-size:19px}
img{width:100%;border-radius:10px;border:1px solid #2f313a}</style></head><body>
<header><h1>Hero photo options (direction B, dark)</h1><p>Generated with Higgsfield (Nano Banana Pro). Desktop on the left, phone on the right.</p></header>
<script>
[["work-focused","1 · Working: strategist studying a wall of ads"],["work-overshoulder","2 · Working: over the shoulder, two screens of ads and timelines"],["happy-leanback","3 · Happy: founder leaning back, pleased"],["happy-pair","4 · Happy: two colleagues laughing at an ad"]].forEach(([k,t])=>document.write(`<div class="row"><h2>${t}</h2><img src="shots/hero-${k}-1440.jpg" alt=""><img src="shots/hero-${k}-390.jpg" alt=""></div>`));
</script></body></html>
